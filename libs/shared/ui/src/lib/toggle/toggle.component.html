<mat-slide-toggle
  color="primary"
  [disabled]="disabled"
  [labelPosition]="labelPosition"
  (change)="toggleChange($event)"
  [checked]="checked"
  [ngClass]="{ 'is-icon': isIcon }"
>
  @if (checked) {
    <span>{{ labelTextOn }}</span>
  }
  @if (!checked) {
    <span>{{ labelTextOff }}</span>
  }
</mat-slide-toggle>
