<h1 class="mb-m">Edit Course Section</h1>

<app-button [routerLink]="['../../']" color="accent"
  >Back to sections</app-button
>
@if (formGroup$ | async; as formGroup) {
  @if (section$ | async; as section) {
    <app-section-admin-form
      class="mt-l"
      [formGroup]="formGroup"
      (saveClicked)="submit($event, section.id)"
      (deleteClicked)="onDelete(section.id)"
    ></app-section-admin-form>
  }
} @else {
  <app-spinner class="center-in-parent"></app-spinner>
}
