<h1 class="mb-m">Edit course styling</h1>

@if (course$ | async; as course) {
  <p>Add custom styles to the course: {{ courseName$ | async }}</p>
  @if (customStylingFormControl$ | async; as customStylingFormControl) {
    <form (submit)="submit(customStylingFormControl, course)">
      <app-textarea [formControl]="customStylingFormControl"> </app-textarea>
      <app-button [type]="'submit'">Save</app-button>
    </form>
  }
} @else {
  <app-spinner></app-spinner>
}

@if (isEditingCourse()) {
  <ng-container [ngTemplateOutlet]="loading"></ng-container>
}

<ng-template #loading>
  <app-spinner></app-spinner>
</ng-template>
